name: arf-os
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: arf
      POSTGRES_DB: arf
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arf"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7.4.6
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
